[project]
name = "unofficial-lava-lamp"
version = "0.1.0"
description = "Single-file async Python client for the unofficial lava lamp RGB API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "face3210" }]
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
